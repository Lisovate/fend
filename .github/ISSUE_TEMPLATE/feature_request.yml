name: Feature request
description: Propose a new capability or workflow improvement
title: "[feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What user problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: What should Fend do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
    validations:
      required: false

  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Would you be willing to open a PR?
      options:
        - "Yes"
        - "No"
        - "Maybe, with guidance"
    validations:
      required: true
