[package]
name = "fendd"
version = "0.0.1"
edition = "2021"

[features]
host-tools = []

[[bin]]
name = "fendd"
path = "src/main.rs"

[[bin]]
name = "fend-vsock-smoke"
path = "src/bin/fend-vsock-smoke.rs"
required-features = ["host-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
strip = true
lto = true
